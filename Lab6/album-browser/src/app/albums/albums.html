<div class="albums-container">
  
  <div *ngIf="loading" class="loading-message">> LOADING_ALBUMS.EXE...</div>
  <div *ngIf="error" class="error-message">! ERROR: Failed to load albums. Retry later.</div>

  <div *ngIf="!loading && !error" class="albums-content">
    <h2 class="albums-title">> ALBUMS_LIST</h2>
    
    <ul class="albums-list">
      <li *ngFor="let album of albums" class="album-item">
        <a [routerLink]="['/albums', album.id]" class="album-link">
          {{ album.title }}
        </a>
        <button (click)="deleteAlbum(album.id)" class="delete-btn">[x]</button>
      </li>
    </ul>
  </div>
</div>
